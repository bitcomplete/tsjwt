apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tsjwt-system
resources:
  - controller.yaml
  - rbac.yaml
# Replace with your own registry, and set -dataplane-image in controller.yaml
# to the same reference: kustomize rewrites `image:` fields but not args.
images:
  - name: tsjwt
    newName: REPLACE_ME/tsjwt
    newTag: gw-v0.8.3
