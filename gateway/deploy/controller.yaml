apiVersion: v1
kind: Namespace
metadata:
  name: tsjwt-system
---
# The GatewayClass this implementation claims. A cluster may run several
# implementations; each reconciles only the classes naming its own controller.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: tsjwt
spec:
  controllerName: tsjwt.dev/gateway-controller
  # Gateway API caps this at 64 bytes.
  description: Identity-aware gateway backed by a tailnet node.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsjwt-controller
  namespace: tsjwt-system
  labels:
    app.kubernetes.io/name: tsjwt-controller
spec:
  # The controller is not in the request path. Data planes keep serving while
  # it is down: their routes are already mounted, and they cache the last
  # table that parsed. One replica is therefore fine, and leader election
  # makes more than one safe rather than necessary.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tsjwt-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tsjwt-controller
    spec:
      serviceAccountName: tsjwt-controller
      securityContext:
        runAsNonRoot: true
        # Distroless names its user, and the kubelet cannot check a name.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: tsjwt   # set by kustomize, or replace
          command: [/usr/local/bin/tsjwt-controller]
          args:
            # The full reference, not the kustomize image name. kustomize
            # rewrites `image:` fields and not args, so an image name here
            # reaches the data plane verbatim and fails to pull.
            - -dataplane-image=REPLACE_ME/tsjwt:gw-v0.8.2
            - -tag=tag:example
            # Must match the grant in projects/tailscale_acls.json. If it
            # does not, WhoIs returns no capabilities, every caller resolves
            # to no tenant, and the gateway answers 403 to everyone.
            - -capability=example.com/cap/tsjwt
            # Grafana refuses a key set over plain HTTP.
            - -jwks-tls
            - -credential-secret=tsjwt-credentials
            - -dataplane-service-account=tsjwt-dataplane
            - -tenants-configmap=tsjwt-tenants
            - -leader-elect=true
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: probes, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
