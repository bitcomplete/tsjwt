# golangci-lint configuration.
#
# The standard set (errcheck, govet, ineffassign, staticcheck, unused) is the
# high-signal core. The tuning below keeps it green on real defects without
# nagging on patterns this codebase deliberately accepts.
version: "2"

linters:
  default: standard
  settings:
    staticcheck:
      # The SA* bug checks plus golangci-lint's default set. The ST* doc/naming
      # checks below are golangci-lint's own defaults (off), kept explicit here
      # because setting `checks` replaces the default rather than extending it.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # QF* are refactor "quick fixes" (tagged switch, drop embedded field),
        # not defects. Leave them off; they are style, not correctness.
        - -QF1002
        - -QF1008
  exclusions:
    # A failed write to an HTTP response, a deferred Close, or an Fprintln to a
    # ResponseWriter cannot be meaningfully handled; the standard preset covers
    # exactly those and keeps errcheck focused on returns that matter.
    presets:
      - std-error-handling
    rules:
      # Unchecked error returns in test setup (e.g. Rotate, json.Unmarshal) are
      # low value: a failure there fails the test anyway. Keep errcheck strict
      # for non-test code.
      - path: _test\.go
        linters:
          - errcheck
