name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./... && (cd tsnetid && go vet ./...)

      - name: test
        run: go test -race ./...

      # The core must never grow a dependency. A backend that only verifies
      # tokens takes on nothing, and that is a property worth enforcing
      # rather than documenting.
      - name: core is stdlib-only
        run: |
          deps=$(go list -deps ./... | grep -E '^[a-z0-9.-]+\.[a-z]{2,}/' \
                 | grep -v '^github.com/bitcomplete/tsjwt' || true)
          if [ -n "$deps" ]; then
            echo "core module grew a third-party dependency:"; echo "$deps"; exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      # The gitleaks GitHub Action requires a paid licence for repositories
      # owned by an organisation, and fails closed without one. The scanner
      # itself is open source and has no such condition, so run the binary.
      - name: gitleaks
        run: |
          set -euo pipefail
          version=8.21.2
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
